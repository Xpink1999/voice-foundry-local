[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-foundry-local"
version = "0.4.0"
description = "Independent local voice production service"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md", "LICENSES/**/*"]
requires-python = ">=3.11,<3.13"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "python-multipart>=0.0.20", "numpy>=1.26,<3", "soundfile>=0.13", "mcp>=1.12,<2"]

[project.scripts]
voice = "voice_platform.cli:main"
voice-platform-mcp = "voice_platform.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
